<div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SAVE_KEY='aetheria_save_v1';
const zones=[
 {name:'Greendale',tone:'#748b5e',foes:['Mossling','Thornback','Wildfang'],boss:'Elder Treant',desc:'Soft hills and ancient roots.'},
 {name:'Ironcrag',tone:'#927b6b',foes:['Crag Boar','Cave Kobold','Ironhide'],boss:'The Forge Warden',desc:'A scarred range of iron and stone.'},
 {name:'Venomwood',tone:'#597c63',foes:['Sporeling','Venom Stalker','Briar Witch'],boss:'The Mire Queen',desc:'A forest that breathes poison.'},
 {name:'Mistgrave',tone:'#77788e',foes:['Grave Wisp','Hollow Knight','Dusk Hound'],boss:'Warden of the Veil',desc:'Where forgotten souls wander.'},
 {name:'Frostpeak',tone:'#7994a8',foes:['Frostling','Icebound Wolf','Glacier Golem'],boss:'The White Tyrant',desc:'A crown of endless winter.'},
 {name:'Sunscorch Desert',tone:'#b8864e',foes:['Dune Scorpion','Ash Viper','Sunbound'],boss:'The Sand Sovereign',desc:'Gold dunes beneath a burning sky.'},
 {name:'Ashen Dominion',tone:'#a56258',foes:['Cinder Fiend','Ashen Reaver','Ember Drake'],boss:'The Ashen Lord',desc:'A kingdom forged in flame.'},
 {name:'Tower of Eternity',tone:'#8272ad',foes:['Voidling','Astral Sentinel','Time Eater'],boss:'The Eternal',desc:'Climb beyond the edge of time.'}
];
const slots=['Weapon','Head','Chest','Hands','Legs','Feet','Amulet','Ring','Relic'];
const rarityOrder=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Divine'];
const classInfo={Warrior:{icon:'⚔️',weapon:'Oathblade',armor:'Iron Vanguard',skills:['Shield Slam','Whirlwind'],skillIcons:['⬟','⟳'],power:1.25},Mage:{icon:'✦',weapon:'Starweave Staff',armor:'Runesilk',skills:['Comet','Arcane Nova'],skillIcons:['☄','✧'],power:1.05},Assassin:{icon:'◈',weapon:'Gloamfang Daggers',armor:'Nightveil',skills:['Ambush','Fan of Blades'],skillIcons:['◉','✣'],power:1.13}};
const fresh=()=>({version:1,profile:null,level:1,xp:0,hp:100,mp:60,gold:100,gems:12,essence:0,shards:0,prestige:0,zone:0,stage:1,zoneStages:{0:1},kills:0,screen:'battle',inventory:[],equipment:{},skillLv:{},unlocks:{},cosmetics:{},log:['Welcome to Aetheria. Your journey begins here.'],seenBosses:[],activeBuff:0,enemy:{},lastDaily:'',selectedItem:null,shopTab:'Outfit',dungeon:false,dungeonReturnStage:1});
let state;
try{
 const stored=JSON.parse(localStorage.getItem(SAVE_KEY)),base=fresh();
 state=stored&&typeof stored==='object'?{...base,...stored,equipment:{...base.equipment,...(stored.equipment||{})},zoneStages:{...base.zoneStages,...(stored.zoneStages||{})},inventory:Array.isArray(stored.inventory)?stored.inventory:[],log:Array.isArray(stored.log)?stored.log:base.log}:base;
 if(state.profile&&(!classInfo[state.profile.class]||!state.profile.name))state.profile=null;
 state.zone=Math.max(0,Math.min(zones.length-1,Number(state.zone)||0));state.stage=Math.max(1,Number(state.stage)||1);
 if(!['battle','world','gear','forge','shop','profile'].includes(state.screen))state.screen='battle';
}catch{state=fresh()}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){console.warn('Save unavailable',e)}}
function power(){const c=classInfo[state.profile?.class||'Warrior'];return Math.floor((8+state.level*3+state.prestige*5+equipStat())*c.power)}
function equipStat(){return Object.values(state.equipment).reduce((a,x)=>a+(x?.stat||0),0)}
function maxHp(){return 100+state.level*18+state.prestige*35+Object.values(state.equipment).reduce((a,x)=>a+(x?.hp||0),0)}
function maxMp(){return 60+state.level*7+state.prestige*9}
function enemyMax(){const z=state.zone+1,s=state.stage,boss=stageBoss();return Math.floor((34+z*13+s*10)*(boss?5:1)*(state.dungeon?1.4:1)*(1+state.prestige*.12))}
function stageBoss(){return state.stage%10===0}
function enemyName(){const z=zones[state.zone],n=state.stage;return stageBoss()?z.boss:(z.foes[(n-1)%z.foes.length]+(n>3?' '+['Scout','Stalker','Ravager'][Math.floor((n-1)/3)%3]:''))}
function log(text){state.log.unshift(text);state.log=state.log.slice(0,20)}
function gainXp(amount){state.xp+=amount;while(state.xp>=xpNeed()){state.xp-=xpNeed();state.level++;state.hp=maxHp();state.mp=maxMp();log(`Level up! You reached level ${state.level}.`);toast(`Level ${state.level} reached!`)} }
function xpNeed(){return 45+state.level*32}
function toast(msg){const old=$('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2450)}
function makeItem(slot,rarity='Common',tier=3,cls=null){const ri=rarityOrder.indexOf(rarity),base=4+ri*5+(3-tier)*3+state.level;const names={Weapon:['Dawncleaver','Moon Staff','Whisperfang'],Head:['Crown of Embers','Veil Hood','Iron Circlet'],Chest:['Aetherplate','Runesilk Mantle','Nightweave'],Hands:['Grips of Might','Starbound Gloves','Shadow Wraps'],Legs:['Greaves of Resolve','Astral Leggings','Dusk Trousers'],Feet:['Skystriders','Frostwalkers','Silent Steps'],Amulet:['Heart of Aether','Oath Pendant','Wraith Charm'],Ring:['Ring of Echoes','Sunspark Band','Void Loop'],Relic:['Phoenix Sigil','Ancient Rune','Fate Shard']};const icons={Weapon:'⚔',Head:'♜',Chest:'▣',Hands:'◉',Legs:'⛨',Feet:'⌁',Amulet:'◇',Ring:'◌',Relic:'✦'};return {id:Math.random().toString(36).slice(2,10),slot,name:(names[slot]||['Aether Relic'])[Math.floor(Math.random()*3)],rarity,tier,cls,stat:base,hp:Math.floor(base*3),icon:icons[slot]||'◇',count:1}}
function addItem(item){const match=state.inventory.find(x=>x.name===item.name&&x.rarity===item.rarity&&x.tier===item.tier&&x.cls===item.cls);if(match)match.count++;else state.inventory.push(item)}
function hit(amount,skillName='Strike',kind='attack'){
 if(!state.profile)return;const foeMax=enemyMax();state.enemy.hp=state.enemy.hp??foeMax;let damage=amount;const crit=Math.random()<(state.profile.class==='Assassin'?.24:.08);if(crit)damage=Math.floor(damage*1.8);if(state.activeBuff)damage=Math.floor(damage*1.35);state.enemy.hp=Math.max(0,state.enemy.hp-damage);animateHit(damage,crit,kind);log(`${crit?'Critical! ':''}${skillName} deals ${damage} damage.`);if(state.enemy.hp<=0){defeatEnemy();return}scheduleRetaliation();save();render()}
function animateHit(dmg,crit,kind){const f=$('.enemy-figure');if(f){f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit')}const arena=$('.battlefield');if(arena){const d=document.createElement('div');d.className='damage-float';d.style.left=`${58+Math.random()*18}%`;d.style.top=`${32+Math.random()*18}%`;d.style.color=crit?'#ffd36b':kind==='magic'?'#a9d8ff':'#fff4cd';d.textContent=(crit?'CRIT ':'')+dmg;arena.appendChild(d);setTimeout(()=>d.remove(),1000)}}
let retaliationTimer=null;function scheduleRetaliation(){if(retaliationTimer)clearTimeout(retaliationTimer);const boss=stageBoss();if(boss){state.bossWarning=true;render();retaliationTimer=setTimeout(()=>{retaliationTimer=null;if(state.enemy.hp>0)enemyStrike(true)},1100)}else retaliationTimer=setTimeout(()=>{retaliationTimer=null;enemyStrike(false)},2400)}
function enemyStrike(boss){if(!state.profile||state.enemy.hp<=0)return;const art=$('.enemy-figure');if(art){art.classList.remove('attack');void art.offsetWidth;art.classList.add('attack')}let dmg=Math.max(3,Math.floor((5+state.zone*3+state.stage*.8)*(boss?2.3:1)-equipStat()*.14));state.hp=Math.max(0,state.hp-dmg);state.bossWarning=false;log(`${enemyName()} hits you for ${dmg}.`);const arena=$('.battlefield');if(arena){const d=document.createElement('div');d.className='damage-float';d.style.left='24%';d.style.top='53%';d.style.color='#ff9a91';d.textContent='−'+dmg;arena.appendChild(d);setTimeout(()=>d.remove(),900)}if(state.hp<=0){state.hp=Math.floor(maxHp()*.4);state.gold=Math.max(0,state.gold-Math.floor(state.gold*.04));log('You retreat to safety and recover. A small gold fee was paid.');toast('Recovered at the sanctuary.')}save();render()}
function defeatEnemy(){const boss=stageBoss(),gold=Math.floor((10+state.zone*7+state.stage*2)*(boss?8:1));state.gold+=gold;state.kills++;gainXp(Math.floor((16+state.zone*8+state.stage*3)*(boss?5:1)));state.essence+=boss?3:1;if(state.dungeon||Math.random()<(boss?.9:.24)){const rare=boss?(['Rare','Epic','Legendary'][Math.floor(Math.random()*3)]):(['Common','Uncommon','Rare'][Math.floor(Math.random()*3)]);const item=makeItem(slots[Math.floor(Math.random()*slots.length)],rare,3,Math.random()<.25?state.profile.class:null);addItem(item);log(`Loot: ${item.name} (${rare}).`);toast(`Found ${item.name}!`)}if(boss){state.gems+=3;state.shards+=2;state.seenBosses.push(`${state.zone}-${state.stage}`);log('Boss reward: 3 Gems and 2 Aether Shards!')}log(`Victory! +${gold} Gold${boss?' · Boss defeated':''}.`);if(state.dungeon){state.dungeon=false;state.stage=Math.max(1,state.dungeonReturnStage||1);state.enemy={};log('Dungeon cleared. Your guaranteed cache is yours.')}else{state.zoneStages[state.zone]=state.stage+1;if(state.stage>=20&&state.zone<7){state.zone++;state.stage=state.zoneStages[state.zone]||1;state.zoneStages[state.zone]=state.stage;state.enemy={};toast(`New region unlocked: ${zones[state.zone].name}`)}else{state.stage++;state.enemy={};state.zoneStages[state.zone]=state.stage}}if(retaliationTimer)clearTimeout(retaliationTimer);state.bossWarning=false;save();render()}
function basicAttack(){const w=state.equipment.Weapon;hit(Math.max(1,power()+(w?.stat||0)+Math.floor(Math.random()*4)),state.profile.class==='Warrior'?'Cleave':state.profile.class==='Mage'?'Aether Bolt':'Quick Slash',state.profile.class==='Mage'?'magic':'attack')}
function useSkill(index){const info=classInfo[state.profile.class],skills=info.skills,rank=state.skillLv[skills[index]]||1,cost=index===0?18:32;if(state.mp<cost){toast('Not enough Mana.');return}const last=state.cooldowns?.[index]||0;if(Date.now()-last<(index===0?4500:9000)){toast('Ability is still recovering.');return}state.mp-=cost;state.cooldowns=state.cooldowns||{};state.cooldowns[index]=Date.now();const ratio=[2.5,4][index]+rank*.5;hit(Math.floor(power()*ratio),skills[index],state.profile.class==='Mage'?'magic':'skill');save()}
function render(){if(!state.profile){renderCreation();return}if(!state.enemy||!Object.keys(state.enemy).length)state.enemy={hp:enemyMax()};state.hp=Math.min(state.hp,maxHp());state.mp=Math.min(state.mp,maxMp());const root=$('#app');root.innerHTML=`${header()}${state.screen==='battle'?battleScreen():otherScreen()}${nav()}`;bindCommon();bindOther();if(state.screen==='battle')bindBattle()}
function header(){return `<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-title">AETHERIA</div><div class="brand-sub">SHARDS OF THE VEIL</div></div></div><div class="wallet"><div class="currency"><b>◉</b> ${fmt(state.gold)}</div><div class="currency gems"><b>✧</b> ${fmt(state.gems)}</div></div></header>`}

function nav(){const entries=[['battle','⚔','Battle'],['world','⌖','World'],['gear','◈','Gear'],['forge','⚒','Forge'],['shop','♧','Shop'],['profile','☻','Profile']];return `<nav class="bottom-nav"><div class="nav-inner">${entries.map(([key,icon,label])=>`<button class="nav-btn ${state.screen===key?'active':''}" data-screen="${key}"><i>${icon}</i>${label}</button>`).join('')}</div></nav>`}

function $$(sel){return [...document.querySelectorAll(sel)]}

tem-card"><div class="item-icon">✧</div><div class="item-name">Aether Essence</div><div class="item-meta">Common crafting material</div><b>${state.essence}</b></div><div class="item-card"><div class="item-icon">⬡</div><div class="item-name">Aether Shards</div><div class="item-meta">Boss crafting material</div><b>${state.shards}</b></div></div>`}</main>`}

function shopScreen(){const tab=state.shopTab||'Outfit';const goods={Outfit:[['Wanderer Cloak','A travel-worn cosmetic costume.','🧥',40,'gold'],['Celestial Mantle','A radiant ceremonial look.','✨',16,'gems']],Mounts:[['Mossback Stag','A quiet companion for the road.','🦌',80,'gold'],['Emberwing','A tiny phoenix mount.','🐉',24,'gems']],Pets:[['Lantern Moth','Lights the way through the dark.','🦋',55,'gold'],['Cloud Fox','A playful spirit companion.','🦊',18,'gems']],Effects:[['Starfall Trail','A starlit weapon trail.','🌠',70,'gold'],['Voidfire','An otherworldly weapon glow.','🔥',20,'gems']]};return `<main class="app-shell screen">${pageHead('THE WAYFARER’S BAZAAR','Shop','Earn every reward through play. No purchases, timers, or paywalls.',`<span class="tag">FREE TO PLAY</span>`)}<div class="tab-strip">${Object.keys(goods).map(x=>`<button class="tab-chip ${tab===x?'on':''}" data-shoptab="${x}">${x}</button>`).join('')}</div><div class="panel-grid">${goods[tab].map((x,i)=>{const owned=state.cosmetics[x[0]];return `<article class="item-card"><div class="item-icon">${x[2]}</div><div class="item-name">${x[0]}</div><div class="item-meta">${x[1]}</div><div class="item-meta gold">${x[4]==='gold'?'◉ '+x[3]:'✧ '+x[3]}</div><button class="btn ${owned?'':'gold-btn'}" data-buy="${x[0]}" data-price="${x[3]}" data-currency="${x[4]}" ${owned?'disabled':''}>${owned?'Owned':'Unlock'}</button></article>`}).join('')}</div><div class="section-bar"><h2>Earnable Gems</h2><span class="cyan">✧ ${state.gems}</span></div><div class="card card-pad"><div class="section-title">Daily expedition reward <span class="tag">+5 GEMS</span></div><p class="muted small">Claim once per day. Gems also drop from bosses and world milestones.</p><button class="btn gold-btn" id="daily" ${state.lastDaily===new Date().toDateString()?'disabled':''}>${state.lastDaily===new Date().toDateString()?'Claimed today':'Claim daily reward'}</button></div><div class="notice">Everything is earnable in-game. Online leaderboards, PvP, guilds, and co-op bosses are planned integrations; no simulated players are shown.</div></main>`}
function profileScreen(){const p=state.profile;return `<main class="app-shell screen">${pageHead('HERO PROFILE',esc(p.name),'Your path through the Veil.')}<div class="card"><div class="profile-banner"><div class="big-avatar">${classInfo[p.class].icon}</div><div><div class="eyebrow">${p.faction} · ${p.gender} · ${p.class}</div><h2 style="font:25px Georgia,serif;margin:4px 0">${esc(p.name)}</h2><div class="muted small">Level ${state.level} adventurer · ${state.kills} victories</div></div></div><div class="card-pad"><div class="right-stats"><div class="stat-tile"><strong>${state.level}</strong><span>Level</span></div><div class="stat-tile"><strong>${state.kills}</strong><span>Victories</span></div><div class="stat-tile"><strong>${state.prestige}</strong><span>Prestige</span></div></div><div class="section-bar"><h2>Legacy</h2></div><p class="muted small">Prestige at level 25 to reset your level and world progress. Keep your items, gems, and cosmetics while gaining permanent power.</p><button id="prestige" class="btn gold-btn" ${state.level<25?'disabled':''}>${state.level<25?`Prestige at level 25 · ${state.level}/25`:'Ascend · Prestige'}</button><div class="notice">Each Prestige grants +5 base attack and +35 maximum HP permanently.</div><div class="section-bar"><h2>Online features</h2></div><p class="muted small">Online leaderboards · PvP · Guilds · Shared boss encounters</p><div class="notice">Connection services are not configured in this offline build. No fake rankings or players are displayed.</div><button id="reset" class="btn" style="margin-top:16px">Delete local save</button></div></div></main>`}
function renderCreation(){const root=$('#app');root.innerHTML=`<main class="app-shell" style="max-width:760px;padding-top:7vh"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-title">AETHERIA</div><div class="brand-sub">SHARDS OF THE VEIL</div></div></div><span class="tag">CHARACTER CREATION</span></header><section class="card card-pad" style="padding:clamp(18px,5vw,36px)"><div class="eyebrow">YOUR STORY STARTS HERE</div><h1 style="font:34px Georgia,serif;margin:7px 0">Who will answer the call?</h1><p class="muted">Choose your path. Your class determines your weapon, armor, and unique abilities.</p><label class="form-label">Character name</label><input id="char-name" class="text-input" maxlength="16" placeholder="Enter a name" value="Aetherling"><label class="form-label">Gender</label><div class="choice-row" data-select="gender"><button class="choice on" data-val="Male">♂ Male</button><button class="choice" data-val="Female">♀ Female</button></div><label class="form-label">Faction</label><div class="choice-row" data-select="faction"><button class="choice on" data-val="Angels">✧ Angels</button><button class="choice" data-val="Demons">♨ Demons</button></div><label class="form-label">Choose a class</label><div class="panel-grid" data-select="class" style="grid-template-columns:repeat(3,1fr)">${Object.entries(classInfo).map(([name,c],i)=>`<button class="item-card choice ${i===0?'on':''}" data-val="${name}" style="text-align:left"><div class="item-icon">${c.icon}</div><div class="item-name">${name}</div><div class="item-meta">${name==='Warrior'?'Melee · sturdy strikes':name==='Mage'?'Magic · ranged burst':'Fast · critical hits'}</div><div class="muted" style="font-size:9px">${c.weapon}</div></button>`).join('')}</div><button class="btn gold-btn" id="begin" style="width:100%;margin-top:23px;padding:13px">Enter Aetheria →</button><div class="muted small" style="text-align:center;margin-top:12px">Offline adventure · progress saved on this device</div></section></main>`;const choices={gender:'Male',faction:'Angels',class:'Warrior'};$$('[data-select]').forEach(group=>group.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{group.querySelectorAll('[data-val]').forEach(x=>x.classList.remove('on'));b.classList.add('on');choices[group.dataset.select]=b.dataset.val}));$('#begin').onclick=()=>{const name=$('#char-name').value.trim().slice(0,16);if(!name){toast('Choose a character name first.');return}state=fresh();state.profile={name,gender:choices.gender,faction:choices.faction,class:choices.class};state.hp=maxHp();state.mp=maxMp();const starter=makeItem('Weapon','Common',3,choices.class);starter.name=classInfo[choices.class].weapon;state.equipment.Weapon=starter;state.screen='battle';log(`Welcome, ${name} the ${choices.class}. Tap ATTACK to strike.`);save();render()}}
function bindOther(){
 $$('#gear-tab').forEach(b=>b.onclick=()=>{state.gearTab=(state.gearTab||'Equipment')==='Equipment'?'Skills':'Equipment';render()});
 $$('.tab-chip[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});
 $$('.tab-chip[data-forgetab]').forEach(b=>b.onclick=()=>{state.forgeTab=b.dataset.forgetab;render()});
 $$('.tab-chip[data-shoptab]').forEach(b=>b.onclick=()=>{state.shopTab=b.dataset.shoptab;render()});
 $$('.btn[data-zone]').forEach(b=>b.onclick=()=>{const z=+b.dataset.zone;if(z<=state.zone){state.zone=z;state.stage=state.zoneStages?.[z]||1;state.enemy={};state.screen='battle';save();render()}});
 $('#dungeon')?.addEventListener('click',()=>{if(state.dungeon)return;state.dungeonReturnStage=state.stage;state.dungeon=true;state.stage=10;state.enemy={};state.screen='battle';log('Dungeon entered. A boss guards the chamber.');save();render()});
 $$('.btn[data-equip]').forEach(b=>b.onclick=()=>equipItem(b.dataset.equip));$$('.btn[data-sell]').forEach(b=>b.onclick=()=>sellItem(b.dataset.sell));$$('.btn[data-fuse]').forEach(b=>b.onclick=()=>fuseItem(b.dataset.fuse));
 $$('.btn[data-upskill]').forEach(b=>b.onclick=()=>upgradeSkill(+b.dataset.upskill));$$('.btn[data-craft]').forEach(b=>b.onclick=()=>craftItem(b.dataset.craft));$$('.btn[data-buy]').forEach(b=>b.onclick=()=>buyItem(b));
 $('#daily')?.addEventListener('click',()=>{if(state.lastDaily===new Date().toDateString())return;state.lastDaily=new Date().toDateString();state.gems+=5;log('Daily reward claimed: +5 Gems.');toast('+5 Gems');save();render()});
 $('#prestige')?.addEventListener('click',()=>{if(state.level<25)return;state.prestige++;state.level=1;state.xp=0;state.zone=0;state.stage=1;state.enemy={};state.hp=maxHp();state.mp=maxMp();state.screen='battle';log(`Prestige ${state.prestige}! Your permanent legacy grows stronger.`);toast('Prestige ascension complete!');save();render()});
 $('#reset')?.addEventListener('click',()=>{if(confirm('Delete all Aetheria progress on this device?')){localStorage.removeItem(SAVE_KEY);state=fresh();render()}});
}
function equipItem(id){const x=state.inventory.find(i=>i.id===id);if(!x)return;if(x.cls&&x.cls!==state.profile.class){toast(`Only ${x.cls} can equip this item.`);return}x.count--;if(x.count<=0)state.inventory=state.inventory.filter(i=>i!==x);const old=state.equipment[x.slot];if(old)addItem({...old,id:Math.random().toString(36).slice(2,10),count:1});state.equipment[x.slot]={...x,count:1};state.hp=Math.min(maxHp(),state.hp+x.hp);log(`${x.name} equipped.`);save();render()}
function sellItem(id){const x=state.inventory.find(i=>i.id===id);if(!x)return;const value=Math.max(2,Math.floor((x.stat+x.hp/3)*x.count));state.gold+=value;state.inventory=state.inventory.filter(i=>i!==x);toast(`Sold for ${value} Gold.`);save();render()}
function fuseItem(id){const x=state.inventory.find(i=>i.id===id);if(!x||x.count<4)return;const next=fusionTarget(x);if(next.rarity===x.rarity&&next.tier===x.tier)return;x.count-=4;if(x.count===0)state.inventory=state.inventory.filter(i=>i!==x);const out={...x,id:Math.random().toString(36).slice(2,10),count:1,tier:next.tier,rarity:next.rarity,stat:x.stat+4,hp:x.hp+12};addItem(out);log(`Fusion complete: ${out.name} is now ${out.rarity} T${out.tier}.`);toast(`${out.rarity} T${out.tier} created`);save();render()}
function upgradeSkill(i){const skill=classInfo[state.profile.class].skills[i],rank=state.skillLv[skill]||1,cost=5+rank*4;if(state.essence<cost){toast('Not enough Aether Essence.');return}state.essence-=cost;state.skillLv[skill]=rank+1;toast(`${skill} upgraded to rank ${rank+1}.`);save();render()}
function craftItem(id){const r=craftRecipes.find(x=>x.id===id);if(!r||state.essence<r.cost||state.shards<r.shards){toast('Not enough crafting materials.');return}state.essence-=r.cost;state.shards-=r.shards;if(id==='gem'){state.gems+=3}else{const item=makeItem(id==='weapon'?'Weapon':'Chest','Rare',3,state.profile.class);item.name=id==='weapon'?classInfo[state.profile.class].weapon:'Aetherguard Chest';addItem(item);toast(`${item.name} crafted.`)}save();render()}
function buyItem(b){const price=+b.dataset.price,type=b.dataset.currency,name=b.dataset.buy;if(type==='gold'&&state.gold<price||type==='gems'&&state.gems<price){toast('Not enough currency.');return}if(type==='gold')state.gold-=price;else state.gems-=price;state.cosmetics[name]=true;toast(`${name} unlocked!`);save();render()}

render();
</script>
</body>
</html>
