<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#08080d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AETHERIA — Dark Fantasy MMORPG</title>
  <meta name="description" content="AETHERIA: Ein düsteres Fantasy-MMORPG mit drei Klassen, zwei Fraktionen, acht Reichen, Handwerk, Quests und Reittieren." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/ui.css" />
  <link rel="stylesheet" href="src/styles/screens.css" />
</head>
<body>
  <div id="app">
    <div id="boot" class="boot">
      <div class="boot-sigil">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs><linearGradient id="bgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dca0"/><stop offset=".5" stop-color="#c79a47"/><stop offset="1" stop-color="#7a5724"/></linearGradient></defs>
          <circle cx="60" cy="60" r="54" fill="none" stroke="url(#bgold)" stroke-width="1" opacity=".5"/>
          <circle cx="60" cy="60" r="45" fill="none" stroke="url(#bgold)" stroke-width=".6" opacity=".35" stroke-dasharray="2 5"/>
          <path d="M60 16 L70 50 L104 60 L70 70 L60 104 L50 70 L16 60 L50 50 Z" fill="none" stroke="url(#bgold)" stroke-width="1.4"/>
          <path d="M60 34 L66 54 L86 60 L66 66 L60 86 L54 66 L34 60 L54 54 Z" fill="url(#bgold)" opacity=".85"/>
        </svg>
      </div>
      <div class="boot-title">AETHERIA</div>
      <div class="boot-sub" data-i18n="boot.sub">Die Scherben der Ewigkeit</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-status" data-i18n="boot.loading">Erwecke die Welt …</div>
    </div>
    <div id="screen" class="screen"></div>
    <div id="overlay" class="overlay-layer"></div>
    <div id="toast" class="toast-layer"></div>
    <div id="fx" class="global-fx"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
